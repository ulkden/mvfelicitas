# Hugo configuration file
title: MV Felicitas
baseURL: https://www.mvfelicitas.com/

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Parts 
      pageRef: /parts
      weight: 1
    - name: Contact ↗
      url: "joshua@mvfelicitas.com"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

